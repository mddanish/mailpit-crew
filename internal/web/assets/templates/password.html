{{define "content"}}
<section class="card narrow">
  <h1>Change password</h1>
  <p class="muted">Crew login for {{.User.Username}}. This is not a Mailpit account.</p>
  {{if .Data.Errors}}<div class="flash error"><ul>{{range .Data.Errors}}<li>{{.}}</li>{{end}}</ul></div>{{end}}
  <form method="post" action="{{.Root}}account/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
    <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
    <button type="submit">Change password</button>
  </form>
</section>
{{end}}
