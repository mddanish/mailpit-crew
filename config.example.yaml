# MailPit-Crew example configuration.
# Every setting can also be given as a flag (--listen) or an env var (MPC_LISTEN).
# Priority: flags > env vars > this file > defaults.

# managed (default): Crew downloads, configures and runs Mailpit itself.
# external: Crew manages a Mailpit that you install and run separately.
mode: managed

# Crew home. Managed mode creates:
#   <home>/data/      Crew users, state, backups, audit log
#   <home>/mailpit/   ctl.sh, bin/, mailpit.ini, *.auth, tags.yaml, mailpit.db, mailpit.log
home: /opt/mailpit-crew

# Crew web UI
listen: "[::]:8025"
# webroot: /
tls:
  cert: /opt/mailpit-crew/mailpit/ssl/mail.example.com.fullchain.pem
  key: /opt/mailpit-crew/mailpit/ssl/mail.example.com.key.pem
# log_file: /opt/mailpit-crew/crew.log
# log_level: info

managed:
  # Mailpit to install on first start when none is selected:
  # "latest", a tag such as v1.28.0, or the path to a Mailpit binary.
  # Leave empty to choose in the terminal prompt or the web UI.
  version: latest
  # local address of the Mailpit API (Crew talks to it, users never do)
  api_listen: 127.0.0.1:8026

backups:
  keep: 20

session:
  ttl: 12h

