# MailPit-Crew example configuration.
# Every setting can also be given as a flag (--listen) or an env var (MPC_LISTEN).
# Priority: flags > env vars > this file > defaults.

# Crew home. Crew creates:
#   <home>/data/      Crew login, state, backups, audit log
#   <home>/mailpit/   ctl.sh, bin/, mailpit.ini, *.auth, *.yaml, mailpit.db, mailpit.log
home: /opt/mailpit-crew

# Crew admin web UI. Mailpit's own web UI (where mail is read) listens on
# MP_UI_BIND_ADDR, [::]:8025 by default, set on the Settings page.
listen: "[::]:8080"
# webroot: /
tls:
  cert: /opt/mailpit-crew/mailpit/ssl/mail.example.com.fullchain.pem
  key: /opt/mailpit-crew/mailpit/ssl/mail.example.com.key.pem
# log_file: /opt/mailpit-crew/crew.log
# log_level: info

managed:
  # Mailpit to install on first start when none is selected:
  # "latest", a tag such as v1.32.0, or the path to a Mailpit binary.
  # Leave empty to choose in the terminal prompt or the web UI.
  version: latest

restart:
  # how long Mailpit may take to start after a restart
  timeout: 30s

backups:
  # file backups kept in <home>/data/backups (one per save)
  keep: 50

session:
  ttl: 12h
